<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Singularity | Fundraising redefined</title>
    <meta
      name="description"
      content="Singularity is a platform that connects investors with builders to grow capital together."
    />
    <meta name="theme-color" content="#020203" />
    <style>
      :root {
        color-scheme: dark;
        background: #020203;
      }

      html,
      body,
      #root {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 50% 48%, rgba(255, 106, 74, 0.11), transparent 18rem),
          radial-gradient(circle at 50% 52%, rgba(118, 108, 255, 0.09), transparent 24rem),
          #020203;
      }

      #root:empty::before {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 999px;
        content: "";
        background: conic-gradient(from 180deg, transparent 0 32%, #ff6a4a 48%, #766cff 78%, transparent 100%);
        filter: drop-shadow(0 0 18px rgba(255, 106, 74, 0.46)) drop-shadow(0 0 24px rgba(118, 108, 255, 0.42));
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        transform: translate(-50%, -50%);
        animation: initial-loader-spin 900ms linear infinite;
      }

      @keyframes initial-loader-spin {
        to {
          transform: translate(-50%, -50%) rotate(1turn);
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Singularity" />
    <meta property="og:title" content="Singularity | Fundraising redefined" />
    <meta
      property="og:description"
      content="Singularity is a platform that connects investors with builders to grow capital together."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Singularity fundraising redefined social preview card" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Singularity | Fundraising redefined" />
    <meta
      name="twitter:description"
      content="Singularity is a platform that connects investors with builders to grow capital together."
    />
    <meta name="twitter:image" content="/og-image.svg" />
    <meta name="twitter:image:alt" content="Singularity fundraising redefined social preview card" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
